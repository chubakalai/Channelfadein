# fly.toml app configuration file generated for channelfadein on 2026-11-16T16:43:11Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'channelfadein'
primary_region = 'gru'

[build]
[env]
  TRACKER_DATA_DIR = '/data'

[[mounts]]
  source = 'cfid'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
